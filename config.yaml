lookback_days: 90
lookahead_days: 365
fuzzy_threshold: 85
therapeutic_areas: []
sponsors: []
output_format: both

paths:
  data_dir: data
  reports_dir: reports
  logs_dir: logs
  pdufa_calendar: data/pdufa_calendar.json

http:
  timeout_seconds: 30
  max_retries: 3
  backoff_base_seconds: 2
  user_agent: "fda-pipeline-tracker/0.1 (research)"

content:
  output_dir: content
  csv:
    enabled: true
  newsletter:
    enabled: true
    subject: "FDA Pipeline Weekly — {date}"
  linkedin:
    enabled: true
    max_posts: 5
  llm:
    model: "claude-sonnet-4-20250514"

sources:
  clinicaltrials:
    base_url: "https://clinicaltrials.gov/api/v2/studies"
    page_size: 100
    phases:
      - PHASE1
      - PHASE2
      - PHASE3
    statuses:
      - RECRUITING
      - ACTIVE_NOT_RECRUITING
      - COMPLETED
      - TERMINATED
      - WITHDRAWN
    # Per-drug enrichment: after the event-driven fetch, query CT.gov by drug
    # intervention name (no date filter) for every drug appearing in this run.
    # This is what lets the report list a drug's *full* indication portfolio
    # (e.g. Keytruda's 16 indications) instead of just the trials updated this week.
    per_drug_enrichment:
      enabled: true
      cache_ttl_days: 7         # reuse cached per-drug corpus within this window
      max_drugs: 200            # cap drugs to enrich per run (avoids API blowup)
      max_studies_per_drug: 500 # pagination cap per drug
      pace_seconds: 0.2         # sleep between per-drug requests

  openfda:
    base_url: "https://api.fda.gov/drug/drugsfda.json"
    page_size: 100

  pdufa:
    # FDA.gov does not publish a forward-looking PDUFA calendar. BioPharmCatalyst
    # maintains the most comprehensive public PDUFA/FDA calendar; their HTML pages
    # are server-rendered (see github.com/criminosis/fda-calendar-scraper for a
    # working reference implementation).
    pdufa_url: "https://www.biopharmcatalyst.com/calendars/pdufa-calendar"
    approvals_url: "https://www.biopharmcatalyst.com/calendars/fda-calendar"
    rss_fallback_url: "https://www.fda.gov/about-fda/contact-fda/stay-informed/rss-feeds/press-releases/rss.xml"
