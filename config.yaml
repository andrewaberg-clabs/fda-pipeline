lookback_days: 90
lookahead_days: 365
fuzzy_threshold: 85
therapeutic_areas: []
sponsors: []
output_format: both

paths:
  data_dir: data
  reports_dir: reports
  logs_dir: logs
  pdufa_calendar: data/pdufa_calendar.json

http:
  timeout_seconds: 30
  max_retries: 3
  backoff_base_seconds: 2
  user_agent: "fda-pipeline-tracker/0.1 (research)"

sources:
  clinicaltrials:
    base_url: "https://clinicaltrials.gov/api/v2/studies"
    page_size: 100
    phases:
      - PHASE1
      - PHASE2
      - PHASE3
    statuses:
      - RECRUITING
      - ACTIVE_NOT_RECRUITING
      - COMPLETED
      - TERMINATED
      - WITHDRAWN

  openfda:
    base_url: "https://api.fda.gov/drug/drugsfda.json"
    page_size: 100

  pdufa:
    pdufa_url: "https://www.fda.gov/drugs/new-drugs-fda-cders-new-molecular-entities-and-new-therapeutic-biological-products/pdufa-dates"
    approvals_url: "https://www.fda.gov/drugs/nda-and-bla-approvals"
    rss_fallback_url: "https://www.fda.gov/about-fda/contact-fda/stay-informed/rss-feeds/press-releases/rss.xml"
